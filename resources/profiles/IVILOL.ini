# Print profiles for the IVILOL (UlTi Steel) printers.
# Based on the PrusaSlicer vendor profile convention.

[vendor]
repo_id = non-prusa-fff
# Vendor name will be shown by the Config Wizard.
name = IVILOL
# Configuration version of this file. Config file will only be installed, if the config_version differs.
# This means, the server may force the PrusaSlicer configuration to be downgraded.
config_version = 1.0.5
# Where to get the updates from?
config_update_url = https://files.prusa3d.com/wp-content/uploads/repository/PrusaSlicer-settings-master/live/IVILOL/

# The printer models will be shown by the Configuration Wizard in this order,
# also the first model installed & the first nozzle installed will be activated after install.

# Printer model name will be shown by the installation wizard.


[printer_model:UlTi_steel_v3]
name = UlTi Steel 3
variants = 0.4; 0.5; 0.6; 0.8
technology = FFF
family = UlTi Steel 3 поколения
bed_model = US3_bed.stl
bed_texture = US3_texture.png
default_materials = Basic PLA @IVILOL; Basic PETG @IVILOL; Basic ABS @IVILOL;
thumbnail = US3_Thumbnail.png


# Second generation printers
