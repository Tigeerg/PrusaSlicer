# All presets starting with asterisk, for example *common*, are intermediate and they will
# not make it into the user interface

[printer:*0.4nozzle*]
nozzle_diameter = 0.4
max_layer_height = 0.3
min_layer_height = 0.05
printer_variant = 0.4

[printer:*0.5nozzle*]
nozzle_diameter = 0.5
max_layer_height = 0.35
min_layer_height = 0.05
printer_variant = 0.5

[printer:*0.6nozzle*]
nozzle_diameter = 0.6
max_layer_height = 0.45
min_layer_height = 0.05
printer_variant = 0.6

[printer:*0.8nozzle*]
nozzle_diameter = 0.8
max_layer_height = 0.6
min_layer_height = 0.05
printer_variant = 0.8

# Common printer preset
[printer:*common*]
printer_technology = FFF
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\nG92 E0\n
between_objects_gcode = 

extruder_colour = #FFFFFF
extruder_offset = 0x0
gcode_flavor = marlin
autoemit_temperature_commands = 0
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_min_extruding_rate = 0
machine_min_travel_rate = 0
machine_limits_usage = time_estimate_only
remaining_times = 1
silent_mode = 0
printer_notes = ulti
printer_settings_id = 
retract_before_travel = 2
retract_before_wipe = 0%
retract_layer_change = 0
retract_length_toolchange = 10
retract_lift = 0
retract_lift_above = 0
retract_lift_below = 0
retract_restart_extra = 0
retract_restart_extra_toolchange = 0
single_extruder_multi_material = 0
thumbnails = 
toolchange_gcode = M600.1 ;Пауза печати с нагревом
color_change_gcode = M600.1 ;Пауза печати с нагревом
use_firmware_retraction = 0
use_relative_e_distances = 1
use_volumetric_e = 0
variable_layer_height = 1
wipe = 0
z_offset = 0
extruder_clearance_height = 20
extruder_clearance_radius = 70


[printer:*gen_v3*]
default_print_profile = US3 - 0.15mm 0.4 nozzle
retract_length = 0.5
retract_speed = 25
start_gcode = G21 ;mm units\nG90 ;absolute positioning\nM82 ;absolute positioning for extruder\nG92 E0 ;reset extruder length\n\nM140 S[first_layer_bed_temperature] ;set bed temp\nM190 S[first_layer_bed_temperature] ;wait bed temp\nM104 S[first_layer_temperature] ;set hotend temp\nM109 S[first_layer_temperature] ;wait hotend temp\n\nM300 P500 S500 ;Song\nG28 ;Homing\n\nG12 ;Cleaning the nozzle on the brush\nG0 Z5\nG0 X{print_bed_size[0] - 10} Y{print_bed_size[1] - 10} F10000\nG0 Z1.5\nG30 Z0 F20\nG0 Z0.5\nG1 X{print_bed_size[0] - 35} E20 F500\nG92 E0 ;reset extruder length\nG0 Z0.1\nG1 X{print_bed_size[0] - 55} E-0.5 F2000\nG0 X{print_bed_size[0] / 2} F20000\nG92 E0 ;reset extruder length\n\n;Enable filament detector\nM406\n\n;Put printing message on LCD screen\nM117 Printing...\n
end_gcode = M405 ;disable filament detector\nM104 S0 ;turn off extruder\nM140 S0 ;turn off bed\nG91;relative positioning\nG0 F360 Z+1 ;short fnd fast move up\nG1 E-5 F300 ;short retract at 5mm/s\nG1 E-15 F1200 ;fast retract at 20mm/s\nG90 ;absolute positioning\nG0 X{print_bed_size[0] - 10} Y{print_bed_size[1] - 10} F10000; go to origin part one\nG28 F300 X0 Y0 Z0; go to origin part two\nM107 ;turn off model fan
machine_max_acceleration_e = 12000
machine_max_acceleration_extruding = 3000
machine_max_acceleration_retracting = 3000
machine_max_acceleration_x = 12000
machine_max_acceleration_y = 12000
machine_max_acceleration_z = 500
machine_max_feedrate_e = 500
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 12
machine_max_jerk_e = 2.5
machine_max_jerk_x = 10
machine_max_jerk_y = 10
machine_max_jerk_z = 0.2

[printer:*gen_v2*]
default_print_profile = US2 - 0.15mm 0.4 nozzle
retract_length = 4.5
retract_speed = 50
end_gcode = M405 ;disable filament detector\nM104 S0 ;turn off extruder\nM140 S0 ;turn off bed\nG91;relative positioning\nG0 F360 Z+1 ;short fnd fast move up\nG1 E-5 F300 ;short retract at 5mm/s\nG1 E-15 F1200 ;fast retract at 20mm/s\nG90 ;absolute positioning\nG0 F7200 X10 Y10; go to origin part one\nG28 F300 X0 Y0; go to origin part two\nM107 ;turn off model fan
machine_max_acceleration_e = 10000
machine_max_acceleration_extruding = 3000
machine_max_acceleration_retracting = 3000
machine_max_acceleration_x = 3000
machine_max_acceleration_y = 3000
machine_max_acceleration_z = 500
machine_max_feedrate_e = 300
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 10
machine_max_jerk_e = 2.5
machine_max_jerk_x = 10
machine_max_jerk_y = 10
machine_max_jerk_z = 0.2

[printer:*gen_v1*]
default_print_profile = US1 - 0.15mm 0.4 nozzle
retract_length = 4.5
retract_speed = 50
end_gcode = M104 S0 ;turn off extruder\nM140 S0 ;turn off bed\nG91;relative positioning\nG0 F360 Z+1 ;short fnd fast move up\nG1 E-5 F300 ;short retract at 5mm/s\nG1 E-15 F1200 ;fast retract at 20mm/s\nG90 ;absolute positioning\nG0 F7200 X10 Y10; go to origin part one\nG28 F300 X0 Y0; go to origin part two\nM107 ;turn off model fan
machine_max_acceleration_e = 10000
machine_max_acceleration_extruding = 3000
machine_max_acceleration_retracting = 3000
machine_max_acceleration_x = 3000
machine_max_acceleration_y = 3000
machine_max_acceleration_z = 500
machine_max_feedrate_e = 300
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 10
machine_max_jerk_e = 2.5
machine_max_jerk_x = 10
machine_max_jerk_y = 10
machine_max_jerk_z = 0.2
toolchange_gcode = M600 ;Пауза печати с нагревом
